services:
  
  energy_portal:
    image: energyportal:latest
    ports:
      - "8082:8080"
      - "8083:8081"
    depends_on:
      - "postgres"
    networks:
      - portal-network
    volumes:
      - portal_volume:/var/dpkeys:rw
  
  energy_worker:
    image: energyworker:latest
    depends_on:
      - "postgres"
    networks:
      - worker-network

  postgres:
    container_name: 'postgres'
    image: postgres
    ports:
      - "5432:5432"
    networks:
      - portal-network
      - worker-network
    environment:
      POSTGRES_USER: "energycloud"
      POSTGRES_PASSWORD: "energycloud"
      POSTGRES_DB: "energycloud"
    restart: always
    volumes:
      - ../postgres:/var/lib/postgresql/data

networks:
  portal-network:
    driver: bridge
  worker-network:
    driver: bridge

volumes:
  portal_volume: