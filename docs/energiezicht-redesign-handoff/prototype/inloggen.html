<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergieZicht — Inloggen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ez{--surface:#f3f5f4;--surface-raised:#ffffff;--surface-sunken:#e7ecea;--line:#dbe1de;--line-strong:#7d8a86;--ink:#13201d;--ink-muted:#4d5b57;--brand:#0f5257;--brand-soft:#dcecea;--on-brand:#ffffff;--focus-ring:#0f5257;--status-danger:#b42318;--status-danger-bg:#fdebe9;--tariff-dal-bg:#e3e6f6;--tariff-dal-ink:#2e3a87;--tariff-normaal-bg:#f6ecd9;--tariff-normaal-ink:#7a4e00;--status-live:#16794a;--status-warning:#8a5a00;--status-warning-bg:#fbefd6;--shadow-float:0 8px 24px rgba(19,32,29,.14),0 1px 2px rgba(19,32,29,.08);font-family:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;line-height:22px}
.ez[data-theme="dark"]{--surface:#0e1312;--surface-raised:#161d1b;--surface-sunken:#0a0e0d;--line:#26302d;--line-strong:#62706c;--ink:#e8eeec;--ink-muted:#a1aeaa;--brand:#6fcfc3;--brand-soft:#16302d;--on-brand:#08201d;--focus-ring:#6fcfc3;--status-danger:#f47b6e;--status-danger-bg:#3a1714;--tariff-dal-bg:#1e2340;--tariff-dal-ink:#b3bcf5;--tariff-normaal-bg:#33280f;--tariff-normaal-ink:#f2c56b;--status-live:#4cc98a;--status-warning:#f2b437;--status-warning-bg:#332611;--shadow-float:0 8px 24px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4)}
.ez :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ez .field:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.ez .field input:focus-visible{outline:none}
.ez h1,.ez h2,.ez h3,.ez p{margin:0}
.ez button,.ez input,.ez select{font-family:inherit}
.title-lg{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.01em}
.title{font-size:17px;line-height:24px;font-weight:600}
.label{font-size:13px;line-height:18px;font-weight:500}
.caption{font-size:12px;line-height:16px;font-weight:400;color:var(--ink-muted)}
a{color:var(--brand)}a:hover{color:var(--ink)}
.ez-photo{position:absolute;inset:-32px;background:#2a1d12 url(assets/login-zonnepanelen.jpg) center 55%/cover no-repeat;transform:scale(1.05)}
</style>
</head>
<body>
<!-- Reference prototype generated from the design canvas. Rendered by dc-lite.js; not production code. -->
<div id="dc-root"></div>
<template id="dc-src"><x-dc>

<div class="ez" data-theme="{{theme}}" style="position: relative; overflow: hidden; width: 100%; min-height: 900px; background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; box-sizing: border-box; padding: 48px 16px">
<div class="ez-photo" aria-hidden="true" style="filter: blur({{blurPx}})"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{scrim}}"></div>
<div style="position: relative; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 2px 16px rgba(0, 0, 0, 0.45)">Energie<span style="color: #a8ece3">Zicht</span></div>
<main style="position: relative; box-shadow: var(--shadow-float); width: 100%; max-width: 400px; box-sizing: border-box; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="title-lg">Inloggen</h1>
<p style="color: var(--ink-muted)">Bekijk wat je huis nu verbruikt.</p>
</div>
<sc-if value="{{error}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: var(--status-danger-bg)">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><path d="{{icons.alert}}" style="fill: var(--status-danger)"></path></svg>
<p style="font-size: 14px; line-height: 20px"><strong style="color: var(--status-danger)">E-mailadres of wachtwoord klopt niet.</strong> Probeer het opnieuw of stel een nieuw wachtwoord in.</p>
</div>
</sc-if>
<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="label">E-mailadres</span>
<input type="email" autocomplete="username" value="naam@voorbeeld.nl" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-size: 15px; width: 100%; border: {{fieldBorder}}">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: baseline"><span class="label">Wachtwoord</span><a href="#" style="margin-left: auto; font-size: 13px; line-height: 18px">Wachtwoord vergeten?</a></span>
<span class="field" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; border: {{fieldBorder}}; border-radius: 10px; background: var(--surface-raised); padding-left: 12px">
<input type="{{pwType}}" autocomplete="current-password" value="geheimwachtwoord" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px">
<button type="button" onClick="{{togglePw}}" aria-pressed="{{show}}" style="height: 42px; padding: 0 12px; border: 0; border-radius: 0 10px 10px 0; background: transparent; color: var(--brand); font-size: 14px; font-weight: 600; cursor: pointer">{{pwLabel}}</button>
</span>
</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: var(--brand)">
<span>Ingelogd blijven</span>
</label>
<button type="button" onClick="{{toCode}}" style="height: 44px; border: 0; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: 15px; font-weight: 600; cursor: pointer">Inloggen</button>
</form>
</sc-if>

<sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="title-lg">Bevestig dat jij het bent</h1>
<p style="color: var(--ink-muted)">Voer de 6-cijferige code uit je authenticator-app in.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="label">Code</span>
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-size: 15px; width: 100%; border: 1px solid var(--line-strong); height: 52px; font-size: 24px; letter-spacing: 0.3em; text-align: center; font-weight: 600">
</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer">
<input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: var(--brand)">
<span>Dit apparaat 30 dagen onthouden</span>
</label>
<button type="button" style="height: 44px; border: 0; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: 15px; font-weight: 600; cursor: pointer">Bevestigen</button>
</form>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px">
<a href="#">Geen toegang tot je app? Gebruik een herstelcode</a>
<button type="button" onClick="{{toLogin}}" style="align-self: flex-start; padding: 0; border: 0; background: transparent; color: var(--brand); font-size: 14px; text-decoration: underline; cursor: pointer">Terug naar inloggen</button>
</div>
</sc-if>
</main>
<p style="position: absolute; right: 16px; bottom: 12px; margin: 0; padding: 4px 10px; border-radius: 6px; background: rgba(20, 14, 8, 0.6); font-size: 12px; line-height: 16px; color: #f6f1ea">Foto: Michael Pointner, Pexels</p>
</div>
</x-dc></template>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Weergave"},"step":{"editor":"enum","options":["inloggen","code"],"default":"inloggen","section":"Situatie"},"error":{"editor":"boolean","default":false,"section":"Situatie"},"blur":{"editor":"range","min":0,"max":16,"step":1,"unit":"px","default":8,"section":"Foto"},"scrim":{"editor":"range","min":0,"max":80,"step":5,"unit":"%","default":60,"section":"Foto"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const step = st.step ?? this.props.step ?? 'inloggen';
    const error = st.step ? false : (this.props.error ?? false);
    const show = !!st.show;
    return {
      theme: this.props.theme ?? 'light',
      blurPx: (this.props.blur ?? 8) + 'px',
      scrim: 'rgba(24, 16, 8, ' + ((this.props.scrim ?? 60) / 100) + ')',
      isLogin: step === 'inloggen', isCode: step === 'code', error, show,
      pwType: show ? 'text' : 'password', pwLabel: show ? 'Verberg' : 'Toon',
      fieldBorder: error ? '2px solid var(--status-danger)' : '1px solid var(--line-strong)',
      togglePw: () => this.setState({ show: !show }),
      toCode: () => this.setState({ step: 'code' }),
      toLogin: () => this.setState({ step: 'inloggen' }),
      icons: { alert: 'M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z' }
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
