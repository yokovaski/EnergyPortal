<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergieZicht — Historie (mobiel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.ez{--surface:#f3f5f4;--surface-raised:#ffffff;--surface-sunken:#e7ecea;--line:#dbe1de;--line-strong:#7d8a86;--ink:#13201d;--ink-muted:#4d5b57;--brand:#0f5257;--brand-soft:#dcecea;--on-brand:#ffffff;--focus-ring:#0f5257;--series-verbruik:#2563c9;--series-opname:#a3360b;--series-teruglevering:#13896b;--series-opwekking:#b07800;--series-gas:#7650c0;--status-warning:#8a5a00;--status-warning-bg:#fbefd6;font-family:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;line-height:22px}
.ez[data-theme="dark"]{--surface:#0e1312;--surface-raised:#161d1b;--surface-sunken:#0a0e0d;--line:#26302d;--line-strong:#62706c;--ink:#e8eeec;--ink-muted:#a1aeaa;--brand:#6fcfc3;--brand-soft:#16302d;--on-brand:#08201d;--focus-ring:#6fcfc3;--series-verbruik:#6a9cf0;--series-opname:#de6534;--series-teruglevering:#62dbb4;--series-opwekking:#f2b437;--series-gas:#a98bea;--status-warning:#f2b437;--status-warning-bg:#332611}
.ez :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ez h1,.ez h2,.ez p{margin:0}
.ez button{font-family:inherit}
.num-md{font-size:18px;line-height:24px;font-weight:600}
.title{font-size:17px;line-height:24px;font-weight:600}
.label{font-size:13px;line-height:18px;font-weight:500}
.caption{font-size:12px;line-height:16px;font-weight:400;color:var(--ink-muted)}
.u{font-size:.7em;color:var(--ink-muted);font-weight:500;margin-left:.3em}
.ub{font-size:.7em;color:var(--ink-muted);font-weight:500;margin-right:.3em}
a{color:var(--brand)}a:hover{color:var(--ink)}
</style>
</head>
<body>
<!-- Reference prototype generated from the design canvas. Rendered by dc-lite.js; not production code. -->
<div id="dc-root"></div>
<template id="dc-src"><x-dc>

<div class="ez" data-theme="{{theme}}" style="width: 390px; height: 1280px; overflow: hidden; background: var(--surface); color: var(--ink); display: flex; flex-direction: column">

<header style="flex-shrink: 0; height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: var(--surface-raised); border-bottom: 1px solid var(--line)">
<a href="#" style="font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--ink)">Energie<span style="color: var(--brand)">Zicht</span></a>
<button type="button" aria-label="Accountmenu" style="margin-left: auto; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--brand-soft); color: var(--brand); font-size: 14px; font-weight: 600">EL</button>
</header>

<main style="flex: 1; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column">
<h1 style="font-size: 20px; line-height: 26px; font-weight: 600">Historie</h1>
<span class="caption">13 – 19 nov · per dag</span>
</div>

<div style="display: flex; gap: 8px">
<button type="button" aria-haspopup="dialog" style="flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-size: 15px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.calendar}}" style="fill: var(--ink-muted)"></path></svg>
<span style="flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Laatste 7 dagen</span>
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.down}}" style="fill: var(--ink-muted)"></path></svg>
</button>
<div role="group" aria-label="Eenheid" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-sunken)">
<button type="button" aria-pressed="{{isKwh}}" onClick="{{setKwh}}" style="height: 38px; min-width: 52px; padding: 0 10px; border: 0; border-radius: 6px; background: {{seg.kBg}}; color: {{seg.kFg}}; font-size: 15px; font-weight: {{seg.kFw}}">kWh</button>
<button type="button" aria-pressed="{{eur}}" onClick="{{setEur}}" style="height: 38px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 6px; background: {{seg.eBg}}; color: {{seg.eFg}}; font-size: 15px; font-weight: {{seg.eFw}}">€</button>
</div>
</div>

<sc-if value="{{missing}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 16px; background: var(--status-warning-bg)">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="{{icons.alert}}" style="fill: var(--status-warning)"></path></svg>
<p style="font-size: 14px; line-height: 20px"><strong style="color: var(--status-warning)">Niet alle prijzen zijn bekend.</strong> Stel de gasprijs in onder <a href="#">Instellingen</a>.</p>
</div>
</sc-if>

<div role="tablist" aria-label="Soort" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--line)">
<button type="button" role="tab" aria-selected="{{isEl}}" onClick="{{showEl}}" style="height: 44px; border: 0; border-bottom: 2px solid {{tab.elB}}; background: transparent; color: {{tab.elFg}}; font-size: 15px; font-weight: {{tab.elFw}}; margin-bottom: -1px">Elektriciteit</button>
<button type="button" role="tab" aria-selected="{{isGas}}" onClick="{{showGas}}" style="height: 44px; border: 0; border-bottom: 2px solid {{tab.gasB}}; background: transparent; color: {{tab.gasFg}}; font-size: 15px; font-weight: {{tab.gasFw}}; margin-bottom: -1px">Gas</button>
</div>

<section role="tabpanel" aria-label="{{panelTitle}}" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}">
<div style="min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px">
<div style="width: 52px; height: 52px; border-radius: 999px; background: var(--surface-sunken); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.gas}}" style="fill: var(--series-gas)"></path></svg></div>
<p style="font-weight: 600">Nog geen gasprijs ingesteld</p>
<p style="color: var(--ink-muted); font-size: 14px; line-height: 20px">Stel de gasprijs in om je gaskosten te zien. In m³ zie je je verbruik wel.</p>
<a href="#" style="height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--ink); font-weight: 600; text-decoration: none">Naar Instellingen</a>
</div>
</sc-if>
<sc-if value="{{showChart}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px">
<sc-for list="{{leg}}" as="l" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column">
<span class="label" style="display: flex; align-items: center; gap: 6px"><span style="width: {{l.sw}}; height: {{l.sh}}; border-radius: 2px; background: {{l.c}}"></span>{{l.label}}</span>
<span class="num-md"><sc-if value="{{l.pre}}" hint-placeholder-val="{{false}}"><span class="ub">{{l.pre}}</span></sc-if>{{l.val}}<sc-if value="{{l.unit}}" hint-placeholder-val="{{true}}"><span class="u">{{l.unit}}</span></sc-if></span>
</div>
</sc-for>
</div>
<div style="position: relative; margin-top: 12px">
<svg viewBox="0 0 326 230" role="img" aria-label="{{panelTitle}} per dag" style="display: block; width: 100%; height: auto; overflow: visible">
<path d="{{c.grid}}" style="fill: none; stroke: var(--line); stroke-width: 1"></path>
<path d="{{c.l0.d}}" style="fill: {{c.l0.c}}"></path>
<path d="{{c.l1.d}}" style="fill: {{c.l1.c}}"></path>
<path d="{{c.l2.d}}" style="fill: {{c.l2.c}}"></path>
<path d="{{c.zero}}" style="fill: none; stroke: var(--line-strong); stroke-width: 1"></path>
<path d="{{c.cap.d}}" style="fill: none; stroke: {{c.cap.c}}; stroke-width: 2.5"></path>
</svg>
<span class="caption" aria-hidden="true" style="position: absolute; left: 0; top: -14px; width: {{c.yw}}; text-align: right; padding-right: 6px; box-sizing: border-box">{{c.unit}}</span>
<sc-for list="{{c.yt}}" as="t" hint-placeholder-count="5">
<span class="caption" aria-hidden="true" style="position: absolute; left: 0; top: {{t.top}}; width: {{c.yw}}; transform: translateY(-50%); text-align: right; padding-right: 6px; box-sizing: border-box; white-space: nowrap">{{t.label}}</span>
</sc-for>
<sc-for list="{{c.xt}}" as="t" hint-placeholder-count="7">
<span class="caption" aria-hidden="true" style="position: absolute; left: {{t.left}}; top: {{c.xTop}}; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap"><span>{{t.l1}}</span><span style="color: var(--ink); font-weight: 500">{{t.l2}}</span></span>
</sc-for>
</div>
<p class="caption" style="padding-top: 2px">{{note}}</p>
</sc-if>
</section>

<section aria-labelledby="m-dag" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2 id="m-dag" class="title">Per dag</h2>
<div role="table" aria-label="Per dag">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line-strong)">
<div role="columnheader" class="label" style="padding: 6px 4px">Dag</div>
<div role="columnheader" style="padding: 6px 4px; text-align: right; display: flex; flex-direction: column"><span class="label">Verbruik</span><span class="caption">kWh</span></div>
<div role="columnheader" style="padding: 6px 4px; text-align: right; display: flex; flex-direction: column"><span class="label">Gas</span><span class="caption">m³</span></div>
<div role="columnheader" style="padding: 6px 4px; text-align: right; display: flex; flex-direction: column"><span class="label">Kosten</span><span class="caption">{{kostenUnit}}</span></div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); background: {{r.bg}}; font-weight: {{r.fw}}; font-size: 14px">
<div role="cell" style="padding: 9px 4px; white-space: nowrap">{{r.d}}</div>
<div role="cell" style="padding: 9px 4px; text-align: right">{{r.v}}</div>
<div role="cell" style="padding: 9px 4px; text-align: right">{{r.g}}</div>
<div role="cell" style="padding: 9px 4px; text-align: right; white-space: nowrap">{{r.k}}</div>
</div>
</sc-for>
</div>
</section>
</main>

<nav aria-label="Hoofdmenu" style="flex-shrink: 0; height: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface-raised); border-top: 1px solid var(--line)">
<a href="actueel-mobiel.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--ink-muted)"><span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.dash}}" style="fill: currentColor"></path></svg></span><span style="font-size: 12px; line-height: 16px; font-weight: 500">Actueel</span></a>
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--brand)"><span style="width: 56px; height: 28px; border-radius: 999px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.chart}}" style="fill: currentColor"></path></svg></span><span style="font-size: 12px; line-height: 16px; font-weight: 600">Historie</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--ink-muted)"><span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.cog}}" style="fill: currentColor"></path></svg></span><span style="font-size: 12px; line-height: 16px; font-weight: 500">Instellingen</span></a>
</nav>
</div>
</x-dc></template>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Weergave"},"unit":{"editor":"enum","options":["kwh","eur"],"default":"kwh","section":"Weergave"},"tab":{"editor":"enum","options":["elektriciteit","gas"],"default":"elektriciteit","section":"Weergave"},"solar":{"editor":"boolean","default":true,"section":"Situatie"},"tariffsMissing":{"editor":"boolean","default":false,"section":"Situatie"},"$preview":{"width":390,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const theme = this.props.theme ?? 'light';
    const solar = this.props.solar ?? true;
    const missing = this.props.tariffsMissing ?? false;
    const unit = st.unit ?? this.props.unit ?? 'kwh';
    const tabSel = st.tab ?? this.props.tab ?? 'elektriciteit';
    const eur = unit === 'eur', gas = tabSel === 'gas';
    const nl = (v, d) => v.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
    const pct = (v, of) => (v / of * 100).toFixed(2) + '%';
    const sum = a => a.reduce((x, y) => x + y, 0);

    const names = ['vr', 'za', 'zo', 'ma', 'di', 'wo', 'do'], dates = [13, 14, 15, 16, 17, 18, 19];
    const zeros = names.map(() => 0);
    const V = [9.8, 11.2, 12.4, 9.1, 8.7, 10.3, 6.8];
    const S = solar ? [1.9, 3.1, 0.8, 2.4, 1.2, 1.7, 2.6] : zeros;
    const T = solar ? [0.7, 1.2, 0.2, 0.9, 0.4, 0.5, 0.7] : zeros;
    const G = [3.9, 4.6, 5.1, 4.2, 3.8, 4.4, 3.42];
    const D = S.map((s, i) => s - T[i]);
    const O = V.map((v, i) => v - D[i]);
    const pS = 0.27, pG = 1.35;
    const Oe = O.map(v => v * pS), Te = T.map(v => v * pS), Ee = Oe.map((v, i) => v - Te[i]);
    const Ge = G.map(v => v * pG);

    const chart = (o) => {
      const { W, H, L, R, Tp, B, step, pos, neg, layers, cap, fmt } = o;
      const yMax = Math.max(step, Math.ceil(pos / step - 1e-9) * step);
      const yMin = neg > 1e-9 ? -Math.ceil(neg / step - 1e-9) * step : 0;
      const pw = W - L - R, ph = H - Tp - B, n = names.length, slot = pw / n, bw = slot * 0.56;
      const y = v => Tp + (yMax - v) / (yMax - yMin) * ph;
      const bx = i => L + i * slot + (slot - bw) / 2;
      const rect = (i, a, b) => {
        const y1 = y(Math.max(a, b)), y2 = y(Math.min(a, b));
        if (y2 - y1 < 0.05) return '';
        return 'M' + bx(i).toFixed(1) + ',' + y1.toFixed(1) + 'h' + bw.toFixed(1) + 'V' + y2.toFixed(1) + 'h' + (-bw).toFixed(1) + 'Z';
      };
      const lay = k => layers[k] ? { c: layers[k].c, d: layers[k].t.map((t, j) => rect(j, layers[k].f[j], t)).join(' ') } : { c: 'transparent', d: '' };
      const yt = [];
      for (let v = yMin; v <= yMax + 1e-9; v += step) yt.push({ v, top: pct(y(v), H), label: fmt(v) });
      return {
        l0: lay(0), l1: lay(1), l2: lay(2),
        cap: cap ? { c: cap.c, d: cap.v.map((v, i) => 'M' + bx(i).toFixed(1) + ',' + y(v).toFixed(1) + 'h' + bw.toFixed(1)).join(' ') } : { c: 'transparent', d: '' },
        grid: yt.filter(t => Math.abs(t.v) > 1e-9).map(t => 'M' + L + ',' + y(t.v).toFixed(1) + 'H' + (W - R)).join(' '),
        zero: 'M' + L + ',' + y(0).toFixed(1) + 'H' + (W - R),
        yt, xt: names.map((d, i) => ({ l1: d, l2: String(dates[i]), left: pct(L + i * slot + slot / 2, W) })),
        yw: pct(L, W), xTop: pct(Tp + ph + 6, H), unit: o.unit
      };
    };
    const fmtE = v => (v < 0 ? '−' : '') + '€ ' + nl(Math.abs(v), 0);
    const fmtN = v => (v < 0 ? '−' : '') + nl(Math.abs(v), 0);
    const geo = { W: 326, H: 230, L: 36, R: 2, Tp: 8, B: 40 };

    let c;
    if (gas) {
      c = eur
        ? chart({ ...geo, step: 2, pos: Math.max(...Ge), neg: 0, unit: '€', fmt: fmtE, layers: [{ c: 'var(--series-gas)', f: zeros, t: Ge }] })
        : chart({ ...geo, step: 2, pos: Math.max(...G), neg: 0, unit: 'm³', fmt: fmtN, layers: [{ c: 'var(--series-gas)', f: zeros, t: G }] });
    } else {
      c = eur
        ? chart({ ...geo, step: 1, pos: Math.max(...Oe), neg: Math.max(...Te), unit: '€', fmt: fmtE,
            layers: [{ c: 'var(--series-opname)', f: zeros, t: Oe }, { c: 'var(--series-teruglevering)', f: zeros, t: Te.map(v => -v) }],
            cap: solar ? { c: 'var(--ink)', v: Ee } : null })
        : chart({ ...geo, step: 4, pos: Math.max(...V), neg: Math.max(...T), unit: 'kWh', fmt: fmtN,
            layers: [{ c: 'var(--series-opwekking)', f: zeros, t: D }, { c: 'var(--series-opname)', f: D, t: V }, { c: 'var(--series-teruglevering)', f: zeros, t: T.map(v => -v) }],
            cap: { c: 'var(--series-verbruik)', v: V } });
    }

    const ln = { sw: '14px', sh: '3px' }, sq = { sw: '10px', sh: '10px' };
    const kw = (label, col, v, shape) => ({ label, c: col, pre: '', val: nl(v, 1), unit: 'kWh', ...shape });
    const eu = (label, col, v, shape) => ({ label, c: col, pre: '€', val: nl(v, 2), unit: '', ...shape });
    let leg;
    if (gas) leg = eur ? [eu('Gas', 'var(--series-gas)', sum(Ge), sq)] : [{ label: 'Gas', c: 'var(--series-gas)', pre: '', val: nl(sum(G), 2), unit: 'm³', ...sq }];
    else leg = eur
      ? (solar ? [eu('Totaal', 'var(--ink)', sum(Ee), ln), eu('Opname', 'var(--series-opname)', sum(Oe), sq), eu('Teruglevering', 'var(--series-teruglevering)', sum(Te), sq)]
               : [eu('Opname', 'var(--series-opname)', sum(Oe), sq)])
      : (solar ? [kw('Verbruik', 'var(--series-verbruik)', sum(V), ln), kw('Opname', 'var(--series-opname)', sum(O), sq), kw('Opwekking', 'var(--series-opwekking)', sum(S), sq), kw('Teruglevering', 'var(--series-teruglevering)', sum(T), sq)]
               : [kw('Verbruik', 'var(--series-verbruik)', sum(V), ln), kw('Opname', 'var(--series-opname)', sum(O), sq)]);

    const showEmpty = gas && eur && missing;
    const K = names.map((d, j) => Ee[j] + (missing ? 0 : Ge[j]));
    const rows = names.map((d, j) => ({ d: d + ' ' + dates[j] + ' nov', v: nl(V[j], 1), g: nl(G[j], 2), k: '€ ' + nl(K[j], 2), bg: 'transparent', fw: 400 }))
      .concat([{ d: 'Totaal', v: nl(sum(V), 1), g: nl(sum(G), 2), k: '€ ' + nl(sum(K), 2), bg: 'var(--surface-sunken)', fw: 600 }]);

    const segOn = { bg: 'var(--brand)', fg: 'var(--on-brand)', fw: 600 }, segOff = { bg: 'transparent', fg: 'var(--ink)', fw: 500 };
    const a = eur ? segOff : segOn, b = eur ? segOn : segOff;
    const tOn = { b: 'var(--brand)', fg: 'var(--brand)', fw: 600 }, tOff = { b: 'transparent', fg: 'var(--ink-muted)', fw: 500 };
    const te = gas ? tOff : tOn, tg = gas ? tOn : tOff;

    const icons = {
