<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergieZicht — Instellingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ez{--surface:#f3f5f4;--surface-raised:#ffffff;--surface-sunken:#e7ecea;--line:#dbe1de;--line-strong:#7d8a86;--ink:#13201d;--ink-muted:#4d5b57;--brand:#0f5257;--brand-soft:#dcecea;--on-brand:#ffffff;--focus-ring:#0f5257;--tariff-dal-bg:#e3e6f6;--tariff-dal-ink:#2e3a87;--tariff-normaal-bg:#f6ecd9;--tariff-normaal-ink:#7a4e00;--status-live:#16794a;--status-warning:#8a5a00;--status-warning-bg:#fbefd6;--shadow-float:0 8px 24px rgba(19,32,29,.14),0 1px 2px rgba(19,32,29,.08);font-family:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;line-height:22px}
.ez[data-theme="dark"]{--surface:#0e1312;--surface-raised:#161d1b;--surface-sunken:#0a0e0d;--line:#26302d;--line-strong:#62706c;--ink:#e8eeec;--ink-muted:#a1aeaa;--brand:#6fcfc3;--brand-soft:#16302d;--on-brand:#08201d;--focus-ring:#6fcfc3;--tariff-dal-bg:#1e2340;--tariff-dal-ink:#b3bcf5;--tariff-normaal-bg:#33280f;--tariff-normaal-ink:#f2c56b;--status-live:#4cc98a;--status-warning:#f2b437;--status-warning-bg:#332611;--shadow-float:0 8px 24px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4)}
.ez :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ez .field:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.ez .field input:focus-visible{outline:none}
.ez h1,.ez h2,.ez h3,.ez p{margin:0}
.ez button,.ez input,.ez select{font-family:inherit}
.title-lg{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.01em}
.title{font-size:17px;line-height:24px;font-weight:600}
.label{font-size:13px;line-height:18px;font-weight:500}
.caption{font-size:12px;line-height:16px;font-weight:400;color:var(--ink-muted)}
a{color:var(--brand)}a:hover{color:var(--ink)}
</style>
</head>
<body>
<!-- Reference prototype generated from the design canvas. Rendered by dc-lite.js; not production code. -->
<div id="dc-root"></div>
<template id="dc-src"><x-dc>

<div class="ez" data-theme="{{themeAttr}}" style="width: 100%; min-height: 1360px; background: var(--surface); color: var(--ink); display: flex; flex-direction: column">

<header style="background: var(--surface-raised); border-bottom: 1px solid var(--line)">
<div style="max-width: 1264px; margin: 0 auto; box-sizing: border-box; padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 32px">
<a href="actueel.html" style="font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--ink)">Energie<span style="color: var(--brand)">Zicht</span></a>
<nav aria-label="Hoofdmenu" style="display: flex; gap: 4px">
<a href="actueel.html" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--ink-muted); font-weight: 500; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.dash}}" style="fill: currentColor"></path></svg>Actueel</a>
<a href="historie.html" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--ink-muted); font-weight: 500; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.chart}}" style="fill: currentColor"></path></svg>Historie</a>
<a href="#" aria-current="page" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.cog}}" style="fill: currentColor"></path></svg>Instellingen</a>
</nav>
<button type="button" aria-label="Accountmenu" style="margin-left: auto; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--brand-soft); color: var(--brand); font-size: 14px; font-weight: 600; cursor: pointer">EL</button>
</div>
</header>

<main style="width: 100%; max-width: 1264px; margin: 0 auto; box-sizing: border-box; padding: 32px 32px 48px; display: flex; flex-direction: column; gap: 24px">
<h1 class="title-lg">Instellingen</h1>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<nav aria-label="Onderdelen" style="flex: 0 0 200px; display: flex; flex-direction: column; gap: 2px">
<a href="#algemeen" aria-current="true" style="height: 40px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-weight: 600; text-decoration: none">Algemeen</a>
<a href="#tarieven" style="height: 40px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--ink); text-decoration: none">Tarieven</a>
<a href="#account" style="height: 40px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--ink); text-decoration: none">Account</a>
</nav>

<div style="flex: 999 1 560px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 24px">

<section id="algemeen" aria-labelledby="s-alg" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 8px 24px">
<h2 id="s-alg" class="title" style="padding: 16px 0 8px">Algemeen</h2>
<div style="display: flex; align-items: center; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span id="l-solar" style="font-weight: 600">Systeem met zonnepanelen</span>
<span class="caption" style="font-size: 13px; line-height: 18px">Toont Opwekking en Teruglevering op Actueel en Historie. Uit: je ziet alleen Verbruik en Opname.</span>
</div>
<button type="button" role="switch" aria-checked="{{cur.solar}}" aria-labelledby="l-solar" onClick="{{toggleSolar}}" style="flex-shrink: 0; width: 48px; height: 28px; box-sizing: border-box; padding: 3px; border-radius: 999px; border: 1px solid {{swSolar.border}}; background: {{swSolar.bg}}; display: flex; justify-content: {{swSolar.just}}; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 999px; background: {{swSolar.knob}}"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span id="l-dag" style="font-weight: 600">Dagnaam in grafieken</span>
<span class="caption" style="font-size: 13px; line-height: 18px">Bijvoorbeeld ‘do 19 nov’ in plaats van ‘19 nov’.</span>
</div>
<button type="button" role="switch" aria-checked="{{cur.dayName}}" aria-labelledby="l-dag" onClick="{{toggleDay}}" style="flex-shrink: 0; width: 48px; height: 28px; box-sizing: border-box; padding: 3px; border-radius: 999px; border: 1px solid {{swDay.border}}; background: {{swDay.bg}}; display: flex; justify-content: {{swDay.just}}; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 999px; background: {{swDay.knob}}"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line); flex-wrap: wrap">
<div style="flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 2px">
<span id="l-thema" style="font-weight: 600">Thema</span>
<span class="caption" style="font-size: 13px; line-height: 18px">Systeem volgt de instelling van je apparaat.</span>
</div>
<div role="group" aria-labelledby="l-thema" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-sunken)">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.sel}}" onClick="{{t.pick}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: {{t.fw}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line); flex-wrap: wrap">
<label for="tz" style="flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600">Tijdzone</span>
<span class="caption" style="font-size: 13px; line-height: 18px">Bepaalt waar een dag begint en eindigt.</span>
</label>
<select id="tz" style="width: 280px; height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-size: 15px">
<option value="Europe/Amsterdam" selected>Amsterdam (UTC+1)</option>
<option value="Europe/Brussels">Brussel (UTC+1)</option>
<option value="Europe/London">Londen (UTC+0)</option>
</select>
</div>
</section>

<section id="tarieven" aria-labelledby="s-tar" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="s-tar" class="title">Tarieven</h2>
<p style="color: var(--ink-muted); font-size: 14px; line-height: 20px">Hiermee rekent EnergieZicht je kosten uit. Vul de bedragen in zoals op je contract, inclusief btw.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h3 class="label" style="color: var(--ink-muted)">Stroom per kWh</h3>
<div style="display: grid; grid-template-columns: 120px repeat(2, minmax(0, 1fr)); gap: 12px 16px; align-items: center">
<span></span>
<span class="label" style="display: inline-flex; align-items: center; gap: 4px; justify-self: start; padding: 2px 8px; border-radius: 6px; background: var(--tariff-normaal-bg); color: var(--tariff-normaal-ink)"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.sun}}" style="fill: currentColor"></path></svg>Normaaltarief</span>
<span class="label" style="display: inline-flex; align-items: center; gap: 4px; justify-self: start; padding: 2px 8px; border-radius: 6px; background: var(--tariff-dal-bg); color: var(--tariff-dal-ink)"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.moon}}" style="fill: currentColor"></path></svg>Daltarief</span>

<span id="r-opname" style="font-weight: 500">Opname</span>
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" aria-label="Opname normaaltarief in euro per kWh" value="0,2720" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/kWh</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: {{dalBorder}}; border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" aria-label="Opname daltarief in euro per kWh" value="{{dalVal}}" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/kWh</span></div>
</div>

<span style="font-weight: 500">Teruglevering</span>
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" aria-label="Teruglevering normaaltarief in euro per kWh" value="0,2720" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/kWh</span></div>
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" aria-label="Teruglevering daltarief in euro per kWh" value="0,2540" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/kWh</span></div>
</div>
<sc-if value="{{tariffDirty}}" hint-placeholder-val="{{true}}">
<p class="caption" style="padding-left: 136px">Opname daltarief gewijzigd, was € 0,2540.</p>
</sc-if>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; padding-top: 20px; border-top: 1px solid var(--line)">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="label">Gas</span>
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: {{gasBorder}}; border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" value="{{gasVal}}" placeholder="0,0000" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/m³</span></div>
<sc-if value="{{missing}}" hint-placeholder-val="{{false}}">
<span class="caption" style="display: flex; gap: 6px; align-items: flex-start; color: var(--status-warning)"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="{{icons.alert}}" style="fill: currentColor"></path></svg>Nog niet ingesteld. Zonder gasprijs zie je geen gaskosten.</span>
</sc-if>
</label>
<span></span>
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="label">Vaste kosten stroom</span>
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" value="6,99" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/maand</span></div>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="label">Vaste kosten gas</span>
<div class="field" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised)"><span style="color: var(--ink-muted)">€</span><input type="text" inputmode="decimal" value="6,99" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 15px; text-align: right"><span class="caption">/maand</span></div>
</label>
</div>
</section>

<section id="account" aria-labelledby="s-acc" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 8px 24px">
<h2 id="s-acc" class="title" style="padding: 16px 0 8px">Account</h2>
<div style="display: flex; align-items: center; gap: 24px; padding: 14px 0; border-top: 1px solid var(--line)">
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">E-mailadres</span><span style="color: var(--ink-muted); font-size: 14px">naam@voorbeeld.nl</span></div>
<a href="account.html#email" style="font-weight: 600">Wijzigen</a>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 14px 0; border-top: 1px solid var(--line)">
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Wachtwoord</span><span style="color: var(--ink-muted); font-size: 14px">Laatst gewijzigd op 3 mrt 2026</span></div>
<a href="account.html#wachtwoord" style="font-weight: 600">Wijzigen</a>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 14px 0; border-top: 1px solid var(--line)">
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Tweestapsverificatie</span><span style="color: var(--ink-muted); font-size: 14px; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.check}}" style="fill: var(--status-live)"></path></svg>Aan, met een authenticator-app</span></div>
<a href="account.html#tweestaps" style="font-weight: 600">Beheren</a>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 14px 0; border-top: 1px solid var(--line)">
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Raspberry Pi</span><span style="color: var(--ink-muted); font-size: 14px; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--status-live)"></span>Gekoppeld, laatste meting 13:42:30</span></div>
<a href="#" style="font-weight: 600">Sleutel bekijken</a>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line)">
<button type="button" style="height: 40px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer">Uitloggen</button>
</div>
</section>

<sc-if value="{{dirty}}" hint-placeholder-val="{{true}}">
<div role="region" aria-label="Niet opgeslagen wijzigingen" style="position: sticky; bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 12px 12px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-raised); box-shadow: var(--shadow-float)">
<span style="flex: 1; min-width: 200px">{{dirtyText}}</span>
<button type="button" onClick="{{reset}}" style="height: 40px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer">Herstellen</button>
<button type="button" onClick="{{save}}" style="height: 40px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: 15px; font-weight: 600; cursor: pointer">Opslaan</button>
</div>
</sc-if>
<sc-if value="{{justSaved}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: sticky; bottom: 16px; align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-raised); box-shadow: var(--shadow-float)">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icons.check}}" style="fill: var(--status-live)"></path></svg>
<span>Instellingen opgeslagen.</span>
</div>
</sc-if>
</div>
</div>
</main>
</div>
</x-dc></template>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Weergave"},"dirty":{"editor":"boolean","default":true,"section":"Situatie"},"tariffsMissing":{"editor":"boolean","default":false,"section":"Situatie"},"solar":{"editor":"boolean","default":true,"section":"Situatie"},"$preview":{"width":1440,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const missing = this.props.tariffsMissing ?? false;
    const base = { solar: this.props.solar ?? true, dayName: true, theme: (this.props.theme ?? 'light') === 'dark' ? 'donker' : 'licht' };
    const saved = st.saved ?? base;
    const cur = { solar: st.solar ?? saved.solar, dayName: st.dayName ?? saved.dayName, theme: st.theme ?? saved.theme };
    const tariffDirty = (this.props.dirty ?? true) && !st.cleared;
    const n = (cur.solar !== saved.solar ? 1 : 0) + (cur.dayName !== saved.dayName ? 1 : 0) + (cur.theme !== saved.theme ? 1 : 0) + (tariffDirty ? 1 : 0);
    const dirty = n > 0;
    const sw = on => on
      ? { bg: 'var(--brand)', border: 'var(--brand)', knob: 'var(--on-brand)', just: 'flex-end' }
      : { bg: 'var(--surface-sunken)', border: 'var(--line-strong)', knob: 'var(--ink-muted)', just: 'flex-start' };
    const themes = [['licht', 'Licht'], ['donker', 'Donker'], ['systeem', 'Systeem']].map(([id, label]) => {
      const sel = cur.theme === id;
      return { label, sel, bg: sel ? 'var(--brand)' : 'transparent', fg: sel ? 'var(--on-brand)' : 'var(--ink)', fw: sel ? 600 : 500,
        pick: () => this.setState({ theme: id, justSaved: false }) };
    });
    const icons = {
